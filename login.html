<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Táctico | BuddyBotWEB</title>
    
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <!-- Reutilizamos tu fondo de marca de agua animada -->
    <div class="bg-silhouette"></div>

    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <!-- Avatar del bot brillante -->
                <img src="https://cdn.discordapp.com/avatars/1297733983169417216/742eb2a97534c732c9efd5e9019e9aae.png?size=128" alt="BuddyBot Logo" class="login-logo">
                <h2 class="neon-cyan">ACCESO TÁCTICO</h2>
                <p class="text-muted">Ingresa tus credenciales de Revelations</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="Usuario" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i> INICIAR SESIÓN
                </button>
            </form>

            <div class="login-footer">
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver a la página principal</a>
            </div>
        </div>
    </div>

    <!-- Script de Autenticación -->
    <script src="js/auth.js"></script>
</body>
</html>
